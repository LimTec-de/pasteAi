name: 'publish'

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Arm (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel via cross-compile.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils cmake ninja-build clang libclang-dev pkg-config

      - name: libclang for bindgen (windows)
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: |
          $dir = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path (Join-Path $dir "libclang.dll"))) {
            throw "libclang.dll missing at $dir (windows-latest ships LLVM). bindgen needs LIBCLANG_PATH."
          }
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$dir"

      - name: Install pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: sherpa-onnx Windows MD CRT
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        run: ./scripts/windows-sherpa-md.ps1

      - name: Install trusted-signing-cli
        run: cargo install trusted-signing-cli

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ENABLE_CODE_SIGNING: ${{ secrets.APPLE_DEV_ID_APP_CERTIFICATE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEV_ID_APP_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEV_ID_APP_CERTIFICATE_PASSWORD }}
          #APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          OTHER_CODE_SIGN_FLAGS: --timestamp
          CI: true
        with:
          tagName: pasteAI-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: 'pasteAI v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
