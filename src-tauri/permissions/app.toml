[[permission]]
identifier = "allow-frontmost-app"
description = "Remember the frontmost app and paste into it"
commands.allow = [
    "remember_frontmost_app",
    "restore_frontmost_app",
    "paste_into_frontmost",
    "open_accessibility_settings"
]

[[permission]]
identifier = "allow-apple-system"
description = "Use on-device Apple Intelligence and speech recognition"
commands.allow = [
    "apple_text_availability",
    "apple_speech_availability",
    "apple_improve",
    "apple_dictation_start",
    "apple_dictation_stop",
    "apple_dictation_cancel",
    "apple_list_input_devices",
    "apple_list_speech_languages",
    "apple_install_speech_language"
]

[[permission]]
identifier = "allow-local-stt"
description = "On-device Parakeet speech recognition"
commands.allow = [
    "local_stt_status",
    "local_stt_install",
    "local_stt_preload",
    "local_stt_transcribe"
]
